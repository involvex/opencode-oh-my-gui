<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
	<circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.25" stroke-dasharray="28 10" stroke-linecap="round">
		<animateTransform attributeName="transform" type="rotate" from="0 8 8" to="360 8 8" dur="1.6s" repeatCount="indefinite" />
	</circle>
	<circle cx="8" cy="8" r="2.25" fill="currentColor">
		<animate attributeName="opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite" />
